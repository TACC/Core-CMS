# Copy to docker-compose.agent-<port>.yml (gitignored; keep in main checkout).
# Set build.context AND the CMS volumes path to the absolute path of the worktree you edit.
# When you switch worktrees, update those two paths (filename/port stay the same unless you want a new instance).
# docker compose -f docker-compose.agent-8005.yml -p cms8005 up -d --build
# Do not add anonymous volumes on /code/static or /code/taccsite_cms/static.

services:
  cms:
    build:
      context: /absolute/path/to/Core-CMS-worktree
      dockerfile: Dockerfile
    image: taccwma/core-cms:agent-8005
    ports:
      - 127.0.0.1:8005:8000
    command: ["python3", "manage.py", "runserver", "0.0.0.0:8000"]
    container_name: core_cms_8005
    hostname: core_cms_8005
    volumes:
      - /absolute/path/to/Core-CMS-worktree:/code
    depends_on:
      - postgres
    networks:
      - core_cms_8005_net

  postgres:
    image: postgres:14.9
    environment:
      - POSTGRES_PASSWORD=taccforever
      - POSTGRES_USER=postgresadmin
      - POSTGRES_DB=taccsite
      - PGDATA=/var/lib/postgresql/data/taccsite
    volumes:
      - core_cms_8005_postgres_data:/var/lib/postgresql/data
    hostname: core_cms_postgres_8005
    container_name: core_cms_postgres_8005
    networks:
      core_cms_8005_net:
        aliases:
          - core_cms_postgres

volumes:
  core_cms_8005_postgres_data:

networks:
  core_cms_8005_net:
