# Copy to `docker-compose.agent.yml` (gitignored) for worktree preview on port 8001.
# See AGENTS.md § Agent CMS (worktree preview).
#
# Requires Postgres and Elasticsearch from this repo's `make setup` / `make start`
# (same compose project). Do not assume Port or other checkouts share a network.
services:
  cms_agent:
    image: taccwma/core-cms:latest
    volumes:
      - ${AGENT_WORKTREE:?set AGENT_WORKTREE to the worktree path to mount}:/code
    ports:
      - 127.0.0.1:8001:8000
    command: ["python3", "manage.py", "runserver", "0.0.0.0:8000"]
    container_name: core_cms_agent
    hostname: core_cms_agent
    networks:
      - core_cms_net
